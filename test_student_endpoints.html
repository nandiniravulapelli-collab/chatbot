<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Student Endpoints</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .result { margin-top: 10px; padding: 10px; background: #f5f5f5; border-radius: 4px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Test Student API Endpoints</h1>
    
    <div class="test-section">
        <h2>Test Fees Endpoint</h2>
        <button onclick="testFees()">Test /api/fees</button>
        <div id="feesResult" class="result">Click to test</div>
    </div>
    
    <div class="test-section">
        <h2>Test Exams Endpoint</h2>
        <button onclick="testExams()">Test /api/exams</button>
        <div id="examsResult" class="result">Click to test</div>
    </div>
    
    <div class="test-section">
        <h2>Test Login First</h2>
        <button onclick="testLogin()">Test Login</button>
        <div id="loginResult" class="result">Click to test</div>
    </div>

    <script>
        async function testFees() {
            const resultDiv = document.getElementById('feesResult');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('/api/fees');
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="${response.ok ? 'success' : 'error'}">
                        <strong>Status:</strong> ${response.status}<br>
                        <strong>Success:</strong> ${data.success}<br>
                        <strong>Data:</strong> ${JSON.stringify(data, null, 2)}
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        async function testExams() {
            const resultDiv = document.getElementById('examsResult');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('/api/exams');
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="${response.ok ? 'success' : 'error'}">
                        <strong>Status:</strong> ${response.status}<br>
                        <strong>Success:</strong> ${data.success}<br>
                        <strong>Data:</strong> ${JSON.stringify(data, null, 2)}
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        async function testLogin() {
            const resultDiv = document.getElementById('loginResult');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'admin@university.edu',
                        password: 'admin123'
                    })
                });
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="${response.ok ? 'success' : 'error'}">
                        <strong>Status:</strong> ${response.status}<br>
                        <strong>Success:</strong> ${data.success}<br>
                        <strong>Message:</strong> ${data.message}<br>
                        <strong>Redirect:</strong> ${data.redirect}
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
